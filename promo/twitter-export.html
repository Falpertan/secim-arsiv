<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Twitter kapak — secimarsivi.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  .kart {
    position: relative;
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 1fr 420px;
    background: linear-gradient(118deg, #f7f3ea 0%, #efe8d8 42%, #e4dcc8 100%);
    color: #1a1814;
    font-family: Fraunces, Georgia, 'Times New Roman', serif;
  }
  .kart::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 78% 38%, rgba(200,134,26,0.16), transparent 52%);
    pointer-events: none;
  }
  .sol {
    position: relative;
    z-index: 1;
    padding: 54px 0 0 64px;
    display: flex;
    flex-direction: column;
    max-width: 700px;
  }
  .eyebrow {
    font-family: Inter, Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a07820;
    margin-bottom: 14px;
  }
  .baslik {
    font-size: 46px;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
    max-width: 620px;
  }
  .lede {
    font-family: Inter, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #4b4233;
    font-style: italic;
    max-width: 540px;
    margin-bottom: 36px;
  }
  .stats {
    display: flex;
    align-items: flex-start;
    gap: 0;
    font-family: Inter, Arial, sans-serif;
    margin-top: auto;
    margin-bottom: 28px;
  }
  .stat {
    padding: 0 28px;
    border-left: 1px solid rgba(107, 98, 83, 0.35);
  }
  .stat:first-child { padding-left: 0; border-left: none; }
  .stat-val {
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #1a1814;
  }
  .stat-lbl {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #6b6253;
    margin-top: 6px;
  }
  .alt-cizgi {
    width: 64px;
    height: 3px;
    background: #a07820;
    margin-bottom: 0;
  }
  .sag {
    position: relative;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 24px;
  }
  .harita {
    width: 360px;
    height: auto;
    opacity: 0.22;
    filter: sepia(0.35) saturate(1.4);
    user-select: none;
    pointer-events: none;
  }
  .alt-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px;
    background: rgba(253, 250, 242, 0.72);
    border-top: 1px solid rgba(200, 191, 168, 0.65);
    z-index: 2;
    font-family: Inter, Arial, sans-serif;
  }
  .url {
    font-size: 22px;
    font-weight: 700;
    color: #a07820;
    letter-spacing: 0.01em;
  }
  .marka {
    font-size: 12px;
    font-weight: 600;
    color: #6b6253;
    letter-spacing: 0.03em;
  }
  .badge {
    display: inline-block;
    margin-top: 4px;
    font-family: Inter, Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #1f4d6e;
    background: rgba(31, 77, 110, 0.08);
    border: 1px solid rgba(31, 77, 110, 0.22);
    border-radius: 999px;
    padding: 5px 12px;
  }
</style>
</head>
<body>
<div class="kart">
  <div class="sol">
    <div class="eyebrow">Açık seçim arşivi · 2018 — 2024</div>
    <h1 class="baslik">Türkiye'nin son 13 seçimini tek arşivde inceleyin.</h1>
    <p class="lede">81 il, 973 ilçe. YSK ve TÜİK kaynaklı.<br>Tarafsız dil · reklam yok · ücretsiz erişim</p>
    <span class="badge">+ Anket firmaları modülü (beta)</span>
    <div class="stats">
      <div class="stat">
        <div class="stat-val">13</div>
        <div class="stat-lbl">seçim</div>
      </div>
      <div class="stat">
        <div class="stat-val">81</div>
        <div class="stat-lbl">il</div>
      </div>
      <div class="stat">
        <div class="stat-val">973</div>
        <div class="stat-lbl">ilçe</div>
      </div>
      <div class="stat">
        <div class="stat-val">7</div>
        <div class="stat-lbl">yıl demografi</div>
      </div>
    </div>
    <div class="alt-cizgi"></div>
  </div>
  <div class="sag">
    <img class="harita" src="turkiye-siluet.png" alt="" width="360" height="360">
  </div>
  <div class="alt-bar">
    <div class="url">secimarsivi.com</div>
    <div class="marka">AlperTan™</div>
  </div>
</div>
</body>
</html>
